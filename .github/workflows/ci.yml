name: MedLink CI + QA Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Run Unit Tests, Coverage, and QA Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Vitest with coverage and JUnit
        run: npm run test:ci

      - name: Run 500-case security suite and generate reports
        run: npm run test:security:all

      - name: Upload QA artifacts
        uses: actions/upload-artifact@v5
        with:
          name: medlink-ci-artifacts
          path: |
            test-results/**
            coverage/**
            QA_Test_Report.xlsx
            Security_Report.xlsx
            Security_Report.html
            security-summary.md
            Vulnerability_Report.xml
          retention-days: 30

  e2e-tests:
    name: Playwright Smoke Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build production preview
        run: |
          npm run build
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          sleep 6

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run Playwright smoke tests
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test --config=playwright.config.ts

      - name: Upload Playwright report
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30
