name: MedLink Selenium Automation

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'automation/**'
      - '.github/workflows/automation.yml'
      - 'package.json'

jobs:
  automation-suite:
    name: Selenium QA Automation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Selenium automation catalog
        run: node automation/selenium/seleniumRunner.js

      - name: Build Selenium Excel report
        run: node automation/selenium/seleniumReportGenerator.js

      - name: Run unit regression test for automation catalog
        run: npx vitest run tests/unit/automation-report.test.ts

      - name: Upload Selenium artifacts
        uses: actions/upload-artifact@v4
        with:
          name: selenium-automation-artifacts
          path: |
            test-results/selenium/**
            test-results/automation-reports/Selenium-Automation-Report.xlsx
            test-results/automation-reports/Selenium-Automation-Report.json
          retention-days: 60

      - name: Write workflow summary
        run: node automation/actionSummarySelenium.js
